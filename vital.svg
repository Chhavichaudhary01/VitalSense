<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070D19" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.25" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.25" />
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10B981" flood-opacity="0.25" />
    </filter>

    <!-- Node Gradient Backgrounds -->
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164E63" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="decisionDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#38BDF8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#34D399" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#FBBF24" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#64748B" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Background Subtle Grid -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <path d="M 0,100 L 1100,100 M 0,200 L 1100,200 M 0,300 L 1100,300 M 0,400 L 1100,400 M 0,500 L 1100,500 M 0,600 L 1100,600 M 0,700 L 1100,700 M 0,800 L 1100,800 M 0,900 L 1100,900 M 0,1000 L 1100,1000 M 0,1100 L 1100,1100 M 0,1200 L 1100,1200" />
    <path d="M 100,0 L 100,1320 M 200,0 L 200,1320 M 300,0 L 300,1320 M 400,0 L 400,1320 M 500,0 L 500,1320 M 600,0 L 600,1320 M 700,0 L 700,1320 M 800,0 L 800,1320 M 900,0 L 900,1320 M 1000,0 L 1000,1320" />
  </g>

  <!-- HEADER -->
  <g transform="translate(550, 60)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <text y="0" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="2" font-family="system-ui, -apple-system, sans-serif">ARCHITECTURE &amp; DATA PIPELINE</text>
    <text y="42" fill="#F8FAFC" font-size="28" font-weight="800" letter-spacing="-0.5" font-family="system-ui, -apple-system, sans-serif">VitalSense (SehatSetu) Flowchart</text>
    <text y="70" fill="#94A3B8" font-size="14" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Field Tele-Triage, Offline Outbox Engine &amp; Cloud Synchronization[cite: 1]</text>
  </g>

  <!-- ==================== FLOWCHART CONNECTORS (BEHIND NODES) ==================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Step 1 to Step 2 -->
    <path d="M 550, 205 L 550, 245" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

    <!-- Step 2 to Step 3 -->
    <path d="M 550, 325 L 550, 365" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

    <!-- Step 3 to Decision 1 -->
    <path d="M 550, 445 L 550, 485" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

    <!-- Decision 1: YES -> Red Flag Branch -->
    <path d="M 680, 550 L 780, 550" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrowAmber)" />

    <!-- Decision 1: NO -> Outbox Local -->
    <path d="M 550, 615 L 550, 665" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

    <!-- Rejoin: Red Flag Branch -> Outbox Local -->
    <path d="M 920, 600 L 920, 710 L 730, 710" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowAmber)" />

    <!-- Step 4 (Outbox) to Decision 2 (Network Check) -->
    <path d="M 550, 755 L 550, 805" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

    <!-- Decision 2: NO (Loop to SQLite Wait) -->
    <path d="M 420, 870 L 250, 870" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowMuted)" />
    <path d="M 250, 920 L 250, 960 L 460, 960 L 460, 895" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowMuted)" />

    <!-- Decision 2: YES -> WorkManager Sync -->
    <path d="M 550, 935 L 550, 1005" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrowEmerald)" />

    <!-- Step 5 to Step 6 (Cloud Firestore) -->
    <path d="M 550, 1085 L 550, 1145" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrowEmerald)" />
  </g>

  <!-- ==================== FLOWCHART NODES ==================== -->

  <!-- NODE 1: START (Field Intake) -->
  <g transform="translate(370, 145)" filter="url(#glowCyan)">
    <rect width="360" height="60" rx="30" fill="url(#cyanCard)" stroke="#38BDF8" stroke-width="2" />
    <circle cx="35" cy="30" r="14" fill="#0284C7" />
    <text x="35" y="35" fill="#E0F2FE" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">1</text>
    <text x="65" y="28" fill="#F8FAFC" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Field Intake &amp; Data Entry</text>
    <text x="65" y="47" fill="#BAE6FD" font-size="12" font-family="system-ui, -apple-system, sans-serif">ASHA / Doctor logs vitals, symptoms &amp; Rx[cite: 1]</text>
  </g>

  <!-- NODE 2: On-Device ML/OCR Processing -->
  <g transform="translate(350, 245)" filter="url(#glowPurple)">
    <rect width="400" height="80" rx="14" fill="url(#purpleCard)" stroke="#A78BFA" stroke-width="2" />
    <circle cx="35" cy="40" r="14" fill="#7C3AED" />
    <text x="35" y="45" fill="#EDE9FE" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">2</text>
    <text x="65" y="32" fill="#FFFFFF" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">On-Device OCR &amp; Processing</text>
    <text x="65" y="52" fill="#DDD6FE" font-size="12" font-family="system-ui, -apple-system, sans-serif">ML Kit Scanner ➔ 4-Stage Pre-processing[cite: 1]</text>
    <text x="65" y="68" fill="#C4B5FD" font-size="11" font-weight="500" font-family="system-ui, -apple-system, sans-serif">• Fuzzy Match Rx Dictionary • Zero Cloud PHI Leak[cite: 1]</text>
  </g>

  <!-- NODE 3: TriageEngine Analysis -->
  <g transform="translate(350, 365)" filter="url(#glowCyan)">
    <rect width="400" height="80" rx="14" fill="url(#cyanCard)" stroke="#38BDF8" stroke-width="2" />
    <circle cx="35" cy="40" r="14" fill="#0284C7" />
    <text x="35" y="45" fill="#E0F2FE" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">3</text>
    <text x="65" y="32" fill="#FFFFFF" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">TriageEngine Rule Assessment</text>
    <text x="65" y="52" fill="#BAE6FD" font-size="12" font-family="system-ui, -apple-system, sans-serif">Synthesizes BP, SpO2, Heart Rate, &amp; Symptoms[cite: 1]</text>
    <text x="65" y="68" fill="#7DD3FC" font-size="11" font-weight="500" font-family="system-ui, -apple-system, sans-serif">• Deterministic severity scoring (Zero API dependency)[cite: 1]</text>
  </g>

  <!-- DECISION 1: Critical Vitals / Red Flags? -->
  <g transform="translate(550, 550)">
    <polygon points="0,-65 130,0 0,65 -130,0" fill="url(#decisionDiamond)" stroke="#38BDF8" stroke-width="2.5" />
    <text y="-14" fill="#E0F2FE" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Critical Vitals or</text>
    <text y="6" fill="#E0F2FE" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Red Flags?</text>
    <text y="25" fill="#94A3B8" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">(SpO2 &lt; 90%, BP &gt; 180)[cite: 1]</text>
  </g>

  <!-- Decision 1 Labels -->
  <text x="715" y="540" fill="#FBBF24" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif">YES</text>
  <text x="560" y="640" fill="#38BDF8" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif">NO</text>

  <!-- BRANCH NODE: Emergency Severity Alert -->
  <g transform="translate(780, 500)" filter="url(#glowAmber)">
    <rect width="270" height="100" rx="14" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="2" />
    <text x="20" y="28" fill="#FEF3C7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif">🚨 SEVERE Level Escalation</text>
    <text x="20" y="48" fill="#FDE68A" font-size="11" font-family="system-ui, -apple-system, sans-serif">• Color-coded SeverityBadge alert[cite: 1]</text>
    <text x="20" y="66" fill="#FDE68A" font-size="11" font-family="system-ui, -apple-system, sans-serif">• Auto-SMS fallback with GPS coords</text>
    <text x="20" y="84" fill="#FDE68A" font-size="11" font-family="system-ui, -apple-system, sans-serif">• Break-glass consent override logged</text>
  </g>

  <!-- NODE 4: Local Persistence & Outbox Queue -->
  <g transform="translate(370, 665)" filter="url(#glowCyan)">
    <rect width="360" height="90" rx="14" fill="url(#cyanCard)" stroke="#38BDF8" stroke-width="2" />
    <circle cx="35" cy="45" r="14" fill="#0284C7" />
    <text x="35" y="50" fill="#E0F2FE" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">4</text>
    <text x="65" y="32" fill="#FFFFFF" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Room SQLite &amp; Outbox Enqueue</text>
    <text x="65" y="52" fill="#BAE6FD" font-size="12" font-family="system-ui, -apple-system, sans-serif">• Stored in local table (Single Source of Truth)</text>
    <text x="65" y="68" fill="#BAE6FD" font-size="12" font-family="system-ui, -apple-system, sans-serif">• Creates OutboxEntity with action payload</text>
    <text x="65" y="82" fill="#7DD3FC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">⚡ Immediate UI confirmation (No waiting)</text>
  </g>

  <!-- DECISION 2: Network Connectivity Available? -->
  <g transform="translate(550, 870)">
    <polygon points="0,-65 130,0 0,65 -130,0" fill="url(#decisionDiamond)" stroke="#10B981" stroke-width="2.5" />
    <text y="-12" fill="#ECFDF5" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Internet</text>
    <text y="8" fill="#ECFDF5" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Connected?</text>
    <text y="26" fill="#A7F3D0" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">NetworkType.CONNECTED</text>
  </g>

  <!-- Decision 2 Labels -->
  <text x="560" y="960" fill="#34D399" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif">YES</text>
  <text x="340" y="860" fill="#94A3B8" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif">NO (OFFLINE)</text>

  <!-- BRANCH NODE: Offline Safe State -->
  <g transform="translate(60, 835)">
    <rect width="190" height="85" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <text x="15" y="28" fill="#F1F5F9" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Offline Persistence</text>
    <text x="15" y="48" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">• Retain in SQLite Room</text>
    <text x="15" y="65" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">• WorkManager sleeps</text>
    <text x="15" y="80" fill="#38BDF8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Zero data loss guaranteed</text>
  </g>

  <!-- NODE 5: SyncWorker Execution -->
  <g transform="translate(370, 1005)" filter="url(#glowEmerald)">
    <rect width="360" height="80" rx="14" fill="url(#emeraldCard)" stroke="#10B981" stroke-width="2" />
    <circle cx="35" cy="40" r="14" fill="#059669" />
    <text x="35" y="45" fill="#ECFDF5" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">5</text>
    <text x="65" y="32" fill="#FFFFFF" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">WorkManager SyncWorker</text>
    <text x="65" y="52" fill="#D1FAE5" font-size="12" font-family="system-ui, -apple-system, sans-serif">Awakens in background on connectivity</text>
    <text x="65" y="68" fill="#A7F3D0" font-size="11" font-family="system-ui, -apple-system, sans-serif">Deserializes JSON payload &amp; executes batch sync</text>
  </g>

  <!-- NODE 6: Cloud Firestore & Cloud Triggers -->
  <g transform="translate(350, 1145)" filter="url(#glowEmerald)">
    <rect width="400" height="95" rx="14" fill="url(#emeraldCard)" stroke="#34D399" stroke-width="2" />
    <circle cx="35" cy="47" r="14" fill="#059669" />
    <text x="35" y="52" fill="#ECFDF5" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">6</text>
    <text x="65" y="34" fill="#FFFFFF" font-size="15" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Cloud Firestore &amp; Automation</text>
    <text x="65" y="54" fill="#D1FAE5" font-size="12" font-family="system-ui, -apple-system, sans-serif">1. Updates remote collections &amp; purges outbox item</text>
    <text x="65" y="70" fill="#A7F3D0" font-size="11" font-family="system-ui, -apple-system, sans-serif">2. Cloud Functions trigger push notices via FCM</text>
    <text x="65" y="85" fill="#6EE7B7" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif">3. Append-only medical audit history written</text>
  </g>

  <!-- FOOTER LEGEND -->
  <g transform="translate(150, 1275)">
    <rect x="-30" y="-12" width="860" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1" />
    
    <circle cx="0" cy="5" r="5" fill="#38BDF8" />
    <text x="12" y="9" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Client / Edge Logic</text>

    <circle cx="180" cy="5" r="5" fill="#A78BFA" />
    <text x="192" y="9" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">On-Device ML Engine</text>

    <circle cx="390" cy="5" r="5" fill="#F59E0B" />
    <text x="402" y="9" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Clinical Emergency Path</text>

    <circle cx="610" cy="5" r="5" fill="#34D399" />
    <text x="622" y="9" fill="#94A3B8" font-size="11" font-family="system-ui, -apple-system, sans-serif">Cloud Synchronization</text>
  </g>
</svg>
