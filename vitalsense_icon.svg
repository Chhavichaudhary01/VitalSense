<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow Filter -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1E40AF" flood-opacity="0.35" />
    </filter>
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10B981" flood-opacity="0.6" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Outer Pulse Halo Ring -->
  <circle cx="256" cy="230" r="190" fill="url(#haloGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="3" />

  <!-- Core Shield / Emblem Circle -->
  <circle cx="256" cy="230" r="150" fill="url(#shieldGrad)" stroke="#60A5FA" stroke-width="4" filter="url(#shieldGlow)" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Iconic Bold "V" Chevron -->
  <path d="M190 145 L256 310 L322 145 L286 145 L256 226 L226 145 Z" fill="url(#vGrad)" />

  <!-- ECG Heartbeat Waveform across bottom of the shield -->
  <path d="M 60 410 
           L 180 410 
           L 205 385 
           L 220 445 
           L 245 355 
           L 270 455 
           L 290 395 
           L 310 410 
           L 452 410" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#ecgGlow)" />

  <!-- Heartbeat Accent Dot -->
  <circle cx="452" cy="410" r="6" fill="#10B981" />
</svg>
